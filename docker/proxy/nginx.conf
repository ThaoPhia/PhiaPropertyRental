events {}

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $ssl_preread_server_name $backend {
        phiapropertyrental.test phia-property-rental:3000;
        talentreferralplateform.test talent-referral-platform:443;
        default 127.0.0.1:1;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_pass $backend;
    }
}
