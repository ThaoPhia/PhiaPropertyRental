name: phia-property-rental

services:
  app:
    build: .
    init: true
    command: ["node", "scripts/docker-start.mjs"]
    networks:
      default:
      local_https:
        aliases:
          - phia-property-rental
    ports:
      - "127.0.0.1:${SITE_PORT:?Set SITE_PORT in .env}:3000"
    env_file:
      - .env
    environment:
      SITE_NAME: ${SITE_NAME:?Set SITE_NAME in .env}
      SITE_PORT: ${SITE_PORT:?Set SITE_PORT in .env}
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      NODE_ENV: development
      NEXT_DIST_DIR: .next
      NEXT_PUBLIC_API_URL: ${SITE_URL:?Set SITE_URL in .env}
      SQLITE_DB_PATH: /app/database/phia-property-rental.db
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      mailpit:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    healthcheck:
      test:
        - CMD
        - node
        - scripts/docker-healthcheck.mjs
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  node_modules:
    name: ${DOCKER_SITE_NAME:?Use npm run docker:up to derive the volume name from SITE_NAME}-node-modules
  next_cache:
    name: ${DOCKER_SITE_NAME:?Use npm run docker:up to derive the volume name from SITE_NAME}-next-cache

networks:
  local_https:
    external: true
    name: local-https
